<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bassio Player Profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Stadium Dashboard · Bassio brand build.
   Layout: full-bleed navy band (hero + SoS meter) → sticky segmented main menu → panels swapped in place.
   Phone-first, two-column on desktop (≥ 860px). Brand palette and fonts exactly as supplied. */
:root{
  --navy:#02325d;--blue:#2a80cd;--lightblue:#e6f0ff;
  --gold:#d8b355;--goldlight:#ede3c5;--golddark:#a37a00;
  --green:#00bf63;--burgundy:#882929;--wred:#f94b5a;
  --g-navy:linear-gradient(135deg,#02325d,#2a80cd);
  --g-golddark:linear-gradient(135deg,#a37a00,#d8b355);
  --g-goldlight:linear-gradient(135deg,#d8b355,#ede3c5);
  --g-goldsoft:linear-gradient(180deg,#ede3c5,#ffffff);
  --g-green:linear-gradient(135deg,#00bf63,#2a80cd);
  --g-red:linear-gradient(135deg,#f94b5a,#02325d);
  --g-burg:linear-gradient(135deg,#882929,#c0392b);
  --bg:#f4f7fb;--surface:#ffffff;--surface-2:#eef3fa;--fg:#02325d;--text:#1b2b3f;--muted:#5b6b80;--line:#d9e3ef;
  --display:"Anton","Arial Narrow",Impact,sans-serif;--body:"Montserrat","Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 8px 24px rgba(2,50,93,.10);--r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:hidden}html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1040px;margin:0 auto}

/* ===== prototype controls ===== */
.proto{background:#0b1626;color:#cfd9e6;font-size:11px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:6px}
.proto b{color:var(--gold);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.proto label{display:flex;align-items:center;gap:4px}
.proto select{font:inherit;font-size:11px;background:#16243a;color:#fff;border:1px solid #2c3f5c;border-radius:6px;padding:2px 6px}

/* ===== header band ===== */
.band{background:var(--g-navy);color:#fff;padding-block:12px 70px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-80px;top:-60px;width:360px;height:360px;background:radial-gradient(circle,rgba(216,179,85,.22),transparent 65%);pointer-events:none}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.logo{height:40px;width:auto;color:#fff}
.logo svg{height:100%;width:auto;display:block}
.topline .right{display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;position:relative}
.ib svg{width:19px;height:19px}
.ib .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--wred);border:2px solid var(--navy)}
.viewtog{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.2)}
.viewtog button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75)}
.viewtog button.on{background:var(--gold);color:var(--navy)}
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px 16px;margin-top:22px;position:relative;z-index:1;align-items:start}
.photo{aspect-ratio:4/5;width:100%;border-radius:14px;overflow:hidden;border:3px solid var(--gold);box-shadow:var(--shadow);background:#fff;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .lvl{position:absolute;left:0;right:0;bottom:0;background:rgba(2,50,93,.85);color:var(--gold);font-family:var(--display);font-size:13px;letter-spacing:.12em;text-align:center;padding:3px}
.who{display:flex;flex-direction:column;gap:8px;min-width:0}
.who .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.who h1{font-size:34px;line-height:1;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who h1 .ver{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--navy);flex:none}
.who h1 .ver svg{width:14px;height:14px}
.editbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;flex:none}
.editbtn svg{width:18px;height:18px}
.hl{display:flex;flex-wrap:wrap;gap:6px}
.hl span{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;background:rgba(216,179,85,.18);border:1px solid rgba(216,179,85,.55);color:#fff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600}
.hl span b{color:var(--gold);font-weight:800;letter-spacing:.04em}
.hl span svg{width:14px;height:14px;color:var(--gold)}
.hl button{display:grid;place-items:center;color:var(--goldlight)}
.hl button svg{width:14px;height:14px}
.sub-ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--navy)}
.sub-ic svg{width:11px;height:11px;color:var(--navy)!important}
/* SoS meter */
.sos{grid-column:1/-1;margin-top:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:12px 14px;position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center}
.sos .ic{width:48px;height:48px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center}
.sos .ic svg{width:28px;height:28px}
.sos .lab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sos .lab .score{font-family:var(--display);font-size:30px;line-height:1}
.sos .lab .score small{font-size:16px;opacity:.8}
.sos .lab .cat{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.meter{grid-column:1/-1;position:relative;height:28px}
.meter .segs{display:grid;grid-template-columns:1.5fr 2.5fr 2.5fr 2.5fr;gap:3px;height:8px;border-radius:4px;overflow:hidden;position:absolute;left:0;right:0;top:4px}
.meter .segs i{background:rgba(255,255,255,.25)}
.meter .segs i.on{background:var(--gold)}
.meter .mark{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:#fff;box-shadow:0 0 0 3px var(--navy);transform:translateX(-50%)}
.meter .ticks{position:absolute;left:0;right:0;top:16px;font-style:normal;display:grid;grid-template-columns:1.5fr 2.5fr 2.5fr 2.5fr;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.meter .ticks span{text-align:center}

@media (min-width:700px){.hero{grid-template-columns:150px 1fr}.sos{grid-column:2}}
.meter .ticks span b{display:none}@media (max-width:460px){.meter .ticks span{font-size:8px}.meter .ticks span i{display:none}.meter .ticks span b{display:inline;font-weight:600}}
/* ===== main menu ===== */
.menu{position:sticky;top:0;z-index:5;margin-top:-52px}
.menu .bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;gap:4px}
.menu button{border-radius:10px;padding:9px 4px;font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.menu button svg{width:20px;height:20px}
.menu button.on{background:var(--g-navy);color:#fff}
.menu button.on svg{color:var(--gold)}
@media (max-width:480px){.menu button{font-size:11px;letter-spacing:.04em;padding:8px 2px}}

/* ===== content ===== */
main{padding-block:18px 48px}
.panel{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:860px){.panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.span{grid-column:1/-1}.panel.one{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h2{font-size:20px;text-transform:uppercase;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card>h2 small,.card .subt{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.card .subt{margin-top:-8px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* secondary menu */
.submenu{display:flex;gap:6px;flex-wrap:wrap}
.submenu button{border:2px solid var(--gold);color:var(--golddark);border-radius:10px;padding:7px 14px;font-weight:700;font-size:13px}
.submenu button.on{background:var(--g-golddark);color:#fff;border-color:transparent}
.submenu button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--muted)}

/* demographics mini cards */
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.minis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mini .ic{width:36px;height:36px;border-radius:10px;background:var(--lightblue);color:var(--blue);display:grid;place-items:center}
.mini .ic svg{width:20px;height:20px}
.mini span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mini b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--navy);line-height:1}

/* specs */
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
@media (max-width:520px){.specs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.spec{border-left:3px solid var(--gold);padding-left:10px}
.spec span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.spec b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--navy)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;background:var(--g-goldsoft);border:1px solid var(--goldlight);border-radius:14px;padding:10px}
.badge .ic{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--gold);display:grid;place-items:center;color:var(--golddark)}
.badge .ic svg{width:24px;height:24px}
.badge .t{font-weight:700;font-size:13px;color:var(--navy);line-height:1.2}
.badge .like{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:#fff}
.badge .like svg{width:13px;height:13px}
.badge .like.on{color:var(--wred);border-color:var(--wred)}
.badges.big{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.badges.big .badge{grid-template-columns:64px 1fr;padding:14px}
.badges.big .ic{width:64px;height:64px}.badges.big .ic svg{width:32px;height:32px}
.badges.big .t{font-size:15px}

/* ad slider */
.ad{background:var(--surface-2);border-radius:var(--r);min-height:110px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;border:1px dashed var(--line)}
.ad .t{font-family:var(--display);font-size:22px;color:var(--navy);text-transform:uppercase}
.ad .dots{position:absolute;bottom:8px;display:flex;gap:5px}
.ad .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.ad .dots i.on{background:var(--gold)}

/* membership card (public overview) */
.memcard{border-radius:var(--r);padding:16px;color:#fff;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.memcard.basic{background:linear-gradient(135deg,#dfe4ea,#c5ccd6);color:var(--blue)}
.memcard.pro{background:var(--g-navy);color:var(--goldlight)}
.memcard.prime{background:var(--g-golddark);color:var(--navy)}
.memcard .ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--navy)}
.memcard .ic svg{width:28px;height:28px}
.memcard h3{font-size:22px;text-transform:uppercase}
.memcard p{margin:0;font-size:12px;opacity:.9}

/* filters */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.filters.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.filters,.filters.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filt{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.filt .ic{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--blue);display:grid;place-items:center}
.filt .ic svg{width:16px;height:16px}
.filt label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.filt select{width:100%;border:0;background:transparent;font:inherit;font-weight:700;color:var(--navy);padding:0}
.filt.req select{color:var(--wred)}

/* stat grid */
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:var(--surface-2);border-radius:12px;padding:10px 8px;text-align:center}
.st b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--navy);line-height:1}
.st span{font-size:9px;display:block;hyphens:manual;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.st.g b{color:var(--golddark)}
.rankpill{background:var(--g-golddark);color:#fff;border-radius:999px;padding:3px 12px;font-family:var(--display);font-size:16px;letter-spacing:.06em}
.linkish{color:var(--blue);font-weight:700;font-size:12px;text-decoration:underline}

/* tables */
.scroller{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.table th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.table td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.table .tn{font-weight:700;color:var(--blue);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit;font-weight:700;text-align:left}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--surface-2);color:var(--navy)}
.tag.gold{background:var(--goldlight);color:var(--golddark)}
.tag.navy{background:var(--navy);color:#fff}
.tag.green{background:rgba(0,191,99,.15);color:#047a42}
.tag.red{background:rgba(249,75,90,.15);color:#b8303c}
.tag.blue{background:var(--lightblue);color:var(--blue)}

/* wallet */
.walletbox{border-radius:var(--r);padding:18px;color:#fff;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.walletbox.pos{background:var(--g-green)}
.walletbox.neg{background:var(--g-red)}
.walletbox .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.9}
.walletbox .bal{font-family:var(--display);font-size:48px;line-height:1}
.walletbox .bal small{font-size:20px;margin-left:6px}
.walletbox .eq{font-size:12px;opacity:.95;display:flex;flex-wrap:wrap;gap:4px 10px}
.wrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.wrow .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.wrow .ic svg{width:22px;height:22px}
.wrow .ic.blue{background:var(--g-navy)}.wrow .ic.gold{background:var(--g-golddark)}.wrow .ic.red{background:var(--g-burg)}
.wrow .amt{font-family:var(--display);font-size:26px;color:var(--navy);text-align:right;line-height:1}
.wrow .amt.neg{color:var(--burgundy)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn svg{width:16px;height:16px}
.btn.navy{background:var(--g-navy);color:#fff}
.btn.gold{background:var(--g-golddark);color:#fff}
.btn.green{background:var(--g-green);color:#fff}
.btn.red{background:var(--g-burg);color:#fff}
.btn.out{border:1.5px solid var(--line);color:var(--navy);background:#fff}
.btn.wide{width:100%;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* B-Club */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.plans{grid-template-columns:1fr}}
.plans.single{grid-template-columns:1fr}
.plan{border-radius:var(--r);padding:18px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:var(--shadow);position:relative;min-height:230px}
.plan.basic{background:linear-gradient(180deg,#e9edf2,#cfd6df);color:var(--blue)}
.plan.pro{background:var(--g-navy);color:var(--goldlight)}
.plan.prime{background:var(--g-golddark);color:var(--navy)}
.plan .ic{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;color:inherit}
.plan.pro .ic{color:var(--navy)}
.plan .ic svg{width:30px;height:30px}
.plan h3{font-size:24px;text-transform:uppercase;line-height:1}
.plan .price{font-size:13px;font-weight:700;opacity:.9}
.plan .price small{display:block;font-weight:500;opacity:.8}
.plan .cta{margin-top:auto;width:100%;border-radius:10px;padding:10px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:#fff;color:var(--navy)}
.plan.prime .cta{background:var(--navy);color:var(--gold)}
.plan .cta.active{background:var(--green);color:#fff;cursor:default}
.plan.faded{opacity:.45;filter:grayscale(.5);pointer-events:none}
.plan.hi{outline:3px solid var(--gold);outline-offset:3px}
.plan .ribbon{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--navy);border-radius:999px;padding:3px 8px}
.plan.single-wide{flex-direction:row;text-align:left;min-height:0;align-items:center;flex-wrap:wrap}
.plan.single-wide .cta{width:auto;margin-top:0;margin-left:auto}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center}
.cmp .ok{color:var(--green);font-weight:800}
.cmp .no{color:var(--muted)}

/* settings */
.setbtns{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.setbtns{grid-template-columns:repeat(3,minmax(0,1fr))}}
.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.acc summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .pc{font-size:11px;color:var(--muted);font-weight:600}
.acc summary::after{content:"+";font-family:var(--display);font-size:22px;color:var(--golddark);line-height:1}
.acc[open] summary::after{content:"–"}
.acc .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:6px}
.f label .lock{display:inline-flex;align-items:center;gap:3px;color:var(--golddark);text-transform:none;letter-spacing:0;font-weight:600}
.f label .lock svg{width:11px;height:11px}
.f input,.f select{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
.f input:read-only,.f select:disabled{background:var(--surface-2);color:var(--muted)}
.f .hint{font-size:11px;color:var(--muted)}
.f .vis{display:flex;gap:4px}
.f .vis button{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--muted)}
.f .vis button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.supp{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.supp{grid-template-columns:repeat(3,minmax(0,1fr))}}
.supp a{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.supp .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff}
.supp .ic svg{width:24px;height:24px}
.supp .ic.wa{background:#25d366}.supp .ic.ig{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)}.supp .ic.tt{background:#111}
.supp b{display:block;color:var(--navy)}
.supp span{font-size:12px;color:var(--muted)}

/* progress */
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--g-golddark);border-radius:3px}

/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,50,93,.55);display:grid;place-items:end center;padding:0}
@media (min-width:700px){.modal{place-items:center;padding:24px}}
.modal .box{background:var(--bg);color:var(--text);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal .box{border-radius:22px;padding:22px}}
.modal .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal .head h3{font-size:24px;text-transform:uppercase;color:var(--navy);text-wrap:balance}
.modal .x{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.modal .x svg{width:16px;height:16px}

/* tournament popup */
.tcard{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tcard img{aspect-ratio:4/5;object-fit:cover;border-radius:10px;width:100%}
.tcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;align-content:start}
.tcard dt{color:var(--muted);font-weight:600}.tcard dd{margin:0;font-weight:700;color:var(--navy)}
/* group stage card (reference design) */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.gcard .gh{background:var(--g-golddark);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:10px 14px;font-size:13px;font-weight:700}
.gcard .gh :last-child{text-align:right}
.gcard .gh .mid{text-align:center;font-weight:700}
.gcard .cols,.grow{display:grid;grid-template-columns:46px minmax(0,1fr) repeat(5,30px);gap:4px;align-items:center}
@media (min-width:520px){.gcard .cols,.grow{grid-template-columns:70px minmax(0,1fr) repeat(5,48px);gap:6px}.cell{font-size:18px}}
.gcard .cols{background:var(--navy);color:#fff;padding:8px 10px;font-size:11px;font-weight:700;text-align:center}
.gcard .cols span:nth-child(2){text-align:left}
.gcard .rows{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg)}
.grow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative}
.grow.me{border:2px solid var(--gold);background:linear-gradient(90deg,#fff 0%,var(--goldlight) 45%,#fff 100%)}
.pos{justify-self:center;background:var(--navy);color:#fff;border-radius:7px;padding:5px 6px;font-size:11px;font-weight:700;line-height:1;text-align:center}
.grow.me .pos{background:var(--g-navy)}
.players{display:flex;flex-direction:column;gap:6px;min-width:0}
.pl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navy);min-width:0}
.pl i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .full{display:none}@media (min-width:520px){.pl .full{display:inline}.pl .short{display:none}.pl{font-size:13px}}
.pl .av{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:9px;font-weight:800;display:grid;place-items:center;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--gold)}
.pl .av.b{background:var(--blue);color:#fff;box-shadow:0 0 0 1px var(--blue)}
.cell{font-family:var(--display);font-size:16px;text-align:center;color:var(--navy);background:var(--surface-2);border-radius:8px;padding:6px 2px;line-height:1}
.grow.me .cell{background:#fff}
.cell.w{color:var(--green)}.cell.l{color:var(--wred)}.cell.gdp{color:var(--green)}.cell.gdn{color:var(--wred)}
/* match card (reference design) */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.mcard .mh{background:var(--g-navy);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;padding:9px 12px;font-size:12px;font-weight:700;line-height:1.35}
.mcard .mh .c{text-align:center}.mcard .mh .r{text-align:right}
.mcard .mh small{display:block;font-weight:600;opacity:.9}
.mcard .stripe{height:4px}
.mcard.w .stripe{background:var(--green)}.mcard.l .stripe{background:var(--wred)}
.mcard .mb{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.mrow.me{border:2px solid var(--gold);background:linear-gradient(90deg,#fff 0%,var(--goldlight) 50%,#fff 100%)}
.sets{display:flex;gap:6px}
.set{width:40px;height:40px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--navy)}
.mrow.me .set{background:#fff;border:1px solid var(--line)}
.set.w{color:var(--green)}.set.l{color:var(--wred)}
.set.na{color:var(--line)}
.mlist{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.mlist{grid-template-columns:1fr 1fr}}
.roundlab{font-family:var(--display);font-size:16px;color:var(--navy);letter-spacing:.06em;text-transform:uppercase;grid-column:1/-1;margin-top:4px}

/* loyalty tiers popup */
.tiers{display:grid;grid-template-columns:1fr;gap:8px}
.tier{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tier .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;color:#fff}
.tier.cur{outline:2px solid var(--gold)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{text-align:center;font-size:11px;color:var(--muted);padding:16px}
</style>
</head>

function tourModal(id){const t=TOUR.find(x=>x.id==id);
 const av=(n,b)=>`<span class="av ${b?'b':''}">${n.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>`;
 const short=n=>{const w=n.split(' ');return w.length>1?w[0]+' '+w[w.length-1][0]+'.':n;};
 const players=(p1,p2,me)=>`<div class="players"><span class="pl">${av(p1,!me)}<i class="full">${p1}</i><i class="short">${short(p1)}</i></span><span class="pl">${av(p2,!me)}<i class="full">${p2}</i><i class="short">${short(p2)}</i></span></div>`;
 const ord=['1st','2nd','3rd','4th','5th','6th','7th'];
 const grow=(i,p1,p2,P,W,L,Pts,GD,me)=>`<div class="grow ${me?'me':''}"><span class="pos">${ord[i]}</span>${players(p1,p2,me)}<span class="cell">${P}</span><span class="cell w">${W}</span><span class="cell l">${L}</span><span class="cell">${Pts}</span><span class="cell ${GD>=0?'gdp':'gdn'}">${GD>0?'+':''}${GD}</span></div>`;
 const group=`<div class="gcard"><div class="gh"><span>Group 2</span><span class="mid">${t.date} · 06:00 PM</span><span>Court 3</span></div><div class="cols"><span>Position</span><span>Team</span><span>P</span><span>W</span><span>L</span><span>Pts</span><span>GD</span></div><div class="rows">
 ${grow(0,'Youssef Hany','Mostafa Saeed',3,3,0,9,9)}${grow(1,'Bassio Mohamed',t.partner,3,2,1,6,4,true)}${grow(2,'Karim Adel','Hassan Samir',3,1,2,3,-5)}${grow(3,'Ali Farouk','Tarek Mansour',3,0,3,0,-8)}</div></div>`;
 const match=(stage,round,when,court,fmt,opp,mine,theirs)=>{const won=mine.filter((x,i)=>x>theirs[i]).length>theirs.filter((x,i)=>x>mine[i]).length;
  const sets=(a,b)=>`<div class="sets">${a.map((x,i)=>`<span class="set ${x>b[i]?'w':'l'}">${x}</span>`).join('')}</div>`;
  return `<div class="mcard ${won?'w':'l'}"><div class="mh"><span>${stage}<small>${round}</small></span><span class="c">${when}<small>${court}</small></span><span class="r">${t.lvl}<small>${fmt}</small></span></div><div class="stripe"></div><div class="mb"><div class="mrow me">${players('Bassio Mohamed',t.partner,true)}${sets(mine,theirs)}</div><div class="mrow">${players(opp[0],opp[1])}${sets(theirs,mine)}</div></div></div>`;};
 const gm=match('Group 2','Match 1',t.date+' · 06:00 PM','Court 3','1 Long Set',['Karim Adel','Hassan Samir'],[6],[3])+match('Group 2','Match 3',t.date+' · 07:00 PM','Court 3','1 Long Set',['Ali Farouk','Tarek Mansour'],[6],[2])+match('Group 2','Match 5',t.date+' · 08:00 PM','Court 1','1 Long Set',['Youssef Hany','Mostafa Saeed'],[4],[6]);
 const ko=`<div class="roundlab">Round of 16</div>`+match('Knockouts','Round of 16',t.date+' · 09:00 PM','Court 2','1 Super Set',['Seif Eldin','Adham Ragab'],[9],[6])+`<div class="roundlab">Quarter-final</div>`+match('Knockouts','Quarter-final','Next day · 05:00 PM','Court 1','2 Long Sets',['Mahmoud Gamal','Ziad Khaled'],[4,7,10],[6,6,8])+`<div class="roundlab">Semi-final</div>`+match('Knockouts','Semi-final','Next day · 09:00 PM','Court 1','Best of 3 Long Sets',['Omar Tarek','Hany Fouad'],[6,3,5],[4,6,7]);
 modal(t.n,`<div class="tcard"><img src="${A[t.ban]}" alt=""><dl><dt>Date</dt><dd>${t.date}</dd><dt>Venue</dt><dd>${t.venue}</dd><dt>Level</dt><dd>${t.lvl}</dd><dt>Prize</dt><dd>${t.prize}</dd><dt>Partner</dt><dd>${t.partner}</dd></dl></div>
 <div class="submenu segs-local"><button class="on" data-p="g">Group Stage</button><button data-p="k">Knockouts</button></div>
 <div data-pane="g" style="display:flex;flex-direction:column;gap:10px">${group}<div class="kicker">Group matches</div><div class="mlist">${gm}</div></div>
 <div data-pane="k" hidden><div class="mlist">${ko}</div></div>`);}

function pClub(){const c=S.club;
 const plan=(k,extra='',cta='Subscribe')=>{const p=CLUB[k];return `<div class="plan ${p.cls} ${extra}">${extra.includes('hi')?'<span class="ribbon">Upgrade</span>':''}<span class="ic">${I[p.ic]}</span><h3>${p.n}<br>Membership</h3><div class="price">${p.price}${k!=='basic'?'<small>per month</small>':'<small>forever</small>'}</div><ul style="font-size:12px;line-height:1.7">${k==='basic'?'<li>Standard points ×1.0</li><li>Profile &amp; rankings access</li><li>Ads shown</li>':k==='pro'?'<li>Points ×1.25</li><li>24 h priority registration</li><li>Ad-free profile · 5% venue discount</li>':'<li>Points ×1.5</li><li>48 h priority registration</li><li>Mini + Mega season · 15% venue discount</li>'}</ul><button class="cta ${cta==='Active'?'active':''}" data-plan="${k}" ${cta==='Active'?'disabled':''}>${cta}</button></div>`;};

 else if(c==='pro')cards=plan('basic','faded','Included')+plan('pro','','Active')+plan('prime','hi','Upgrade · pay EGP 350 difference');
 else cards=`<div class="plan prime single-wide"><span class="ic">${I.gem}</span><div><h3>B-Prime Membership</h3><div class="price">Active · renews 1 Dec 2026 · EGP 700 / month</div><div style="font-size:12px;margin-top:4px">Points ×1.5 · 48 h priority registration · Mini + Mega season · 15% venue discount</div></div><button class="cta active" disabled>Active</button></div>`;

 <div class="span submenu" id="clubsub"><button class="on">Membership</button><button disabled title="Coming in Phase II">Loyalty Tier</button></div>

function renderMain(){const m=$('#main');
 m.innerHTML={overview:pOverview,badges:pBadges,history:pHistory,wallet:pWallet,bclub:pClub,settings:pSettings}[S.tab]();
 wire(m);
 m.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{const i=b.dataset.like;S.likes[i]=!S.likes[i];renderMain();});

  $('#xfer').onclick=()=>modal('Transfer Savings',`<div class="card"><div class="form"><div class="f full"><label>To player</label><select><option>Omar Khaled · BC-00871</option><option>Ahmed Nabil · BC-01102</option><option>Mostafa Saeed · BC-00455</option></select></div><div class="f"><label>Amount (EGP)</label><input type="number" value="200" min="50"></div><div class="f"><label>Note (optional)</label><input placeholder="Registration share"></div></div><div class="btns" style="justify-content:flex-end"><button class="btn out" data-close>Cancel</button><button class="btn navy" data-close data-toast="EGP 200 sent to Omar Khaled">Transfer</button></div></div>`);}
 m.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const k=b.dataset.plan;const p=CLUB[k];modal(`${S.club==='none'?'Subscribe to':'Upgrade to'} ${p.n}`,`<div class="card"><dl class="tcard" style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;border:0;padding:0;font-size:13px"><dt class="muted">Plan</dt><dd style="margin:0;font-weight:700">${p.n} Membership</dd><dt class="muted">Charge</dt><dd style="margin:0;font-weight:700">${S.club==='pro'&&k==='prime'?'EGP 350 (difference only)':p.price}</dd><dt class="muted">Pay with</dt><dd style="margin:0;font-weight:700">Wallet savings · EGP 650</dd><dt class="muted">Starts</dt><dd style="margin:0;font-weight:700">After admin confirmation (≤ 24 h)</dd></dl><div class="btns" style="justify-content:flex-end"><button class="btn out" data-close>Back</button><button class="btn gold" id="okPlan">Confirm</button></div></div>`).querySelector('#okPlan').onclick=e=>{S.club=k;$('#pcClub').value=k;e.target.closest('.modal').remove();syncHero();renderMain();toast('Request sent · pending admin confirmation');};});
 const se=$('#sEdit');if(se){const body=$('#setbody');const show=(h,who)=>{body.innerHTML=h;wire(body);['sEdit','sSupp'].forEach(id=>$('#'+id).style.opacity=id===who?'1':'.6');};show(editBody(),'sEdit');se.onclick=()=>show(editBody(),'sEdit');$('#sSupp').onclick=()=>show(suppBody(),'sSupp');
  $('#sOut').onclick=()=>modal('Log out?',`<p class="muted" style="margin:0">You will need your phone OTP or password to sign back in.</p><div class="btns" style="justify-content:flex-end"><button class="btn out" data-close>Stay</button><button class="btn red" data-close data-toast="Logged out (prototype)">Log out</button></div>`);}
}
function syncHero(){$('#verIcon').hidden=!S.ver;$('#subIcon').hidden=S.club==='none';$('#editIcon').hidden=S.view==='public';document.querySelectorAll('#viewtog button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));$('#pcView').value=S.view;
 $('.who h1').firstChild.textContent=S.view==='public'?'Bassio ':'Ahlan, Bassio ';}
function setView(v){S.view=v;syncHero();renderMenu();renderMain();}
document.querySelectorAll('#viewtog button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('#pcView').onchange=e=>setView(e.target.value);
$('#pcClub').onchange=e=>{S.club=e.target.value;syncHero();renderMain();};
$('#pcBal').onchange=e=>{S.bal=e.target.value;renderMain();};
$('#pcVer').onchange=e=>{S.ver=e.target.value==='1';syncHero();renderMain();};
$('#editIcon').onclick=()=>{S.tab='settings';renderMenu();renderMain();window.scrollTo({top:$('.menu').offsetTop-8,behavior:'smooth'});};
wire(document);
syncHero();renderMenu();renderMain();
</script>
