<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bassio Tournaments</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Stadium Dashboard · Bassio brand build · Tournaments module.
   Same shell as the Player Profile: navy band → sticky segmented menu (overlaps band by 52 px) → panels swapped in place.
   Core tokens and components below are shared with app.html; module components follow. */
:root{
  --navy:#02325d;--blue:#2a80cd;--lightblue:#e6f0ff;
  --gold:#d8b355;--goldlight:#ede3c5;--golddark:#a37a00;
  --green:#00bf63;--burgundy:#882929;--wred:#f94b5a;
  --g-navy:linear-gradient(135deg,#02325d,#2a80cd);
  --g-golddark:linear-gradient(135deg,#a37a00,#d8b355);
  --g-goldlight:linear-gradient(135deg,#d8b355,#ede3c5);
  --g-goldsoft:linear-gradient(180deg,#ede3c5,#ffffff);
  --g-green:linear-gradient(135deg,#00bf63,#2a80cd);
  --g-red:linear-gradient(135deg,#f94b5a,#02325d);
  --g-burg:linear-gradient(135deg,#882929,#c0392b);
  --bg:#f4f7fb;--surface:#ffffff;--surface-2:#eef3fa;--fg:#02325d;--text:#1b2b3f;--muted:#5b6b80;--line:#d9e3ef;
  --display:"Anton","Arial Narrow",Impact,sans-serif;--body:"Montserrat","Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 8px 24px rgba(2,50,93,.10);--r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:hidden}html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1040px;margin:0 auto}
/* ===== header band ===== */
.band{background:var(--g-navy);color:#fff;padding-block:12px 70px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-80px;top:-60px;width:360px;height:360px;background:radial-gradient(circle,rgba(216,179,85,.22),transparent 65%);pointer-events:none}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.logo{height:40px;width:auto;color:#fff}
.logo svg{height:100%;width:auto;display:block}
.topline .right{display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;position:relative}
.ib svg{width:19px;height:19px}
.ib .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--wred);border:2px solid var(--navy)}
.viewtog{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.2)}
.viewtog button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75)}
.viewtog button.on{background:var(--gold);color:var(--navy)}
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px 16px;margin-top:22px;position:relative;z-index:1;align-items:start}
.photo{aspect-ratio:4/5;width:100%;border-radius:14px;overflow:hidden;border:3px solid var(--gold);box-shadow:var(--shadow);background:#fff;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .lvl{position:absolute;left:0;right:0;bottom:0;background:rgba(2,50,93,.85);color:var(--gold);font-family:var(--display);font-size:13px;letter-spacing:.12em;text-align:center;padding:3px}
.who{display:flex;flex-direction:column;gap:8px;min-width:0}
.who .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.who h1{font-size:34px;line-height:1;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who h1 .ver{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--navy);flex:none}
.who h1 .ver svg{width:14px;height:14px}
.editbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;flex:none}
.editbtn svg{width:18px;height:18px}
.hl{display:flex;flex-wrap:wrap;gap:6px}
.hl span{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;background:rgba(216,179,85,.18);border:1px solid rgba(216,179,85,.55);color:#fff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600}
.hl span b{color:var(--gold);font-weight:800;letter-spacing:.04em}
.hl span svg{width:14px;height:14px;color:var(--gold)}
.hl button{display:grid;place-items:center;color:var(--goldlight)}
.hl button svg{width:14px;height:14px}
.sub-ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--navy)}
.sub-ic svg{width:11px;height:11px;color:var(--navy)!important}
/* ===== main menu ===== */
.menu{position:sticky;top:0;z-index:5;margin-top:-52px}
.menu .bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;gap:4px}
.menu button{border-radius:10px;padding:9px 4px;font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.menu button svg{width:20px;height:20px}
.menu button.on{background:var(--g-navy);color:#fff}
.menu button.on svg{color:var(--gold)}
@media (max-width:480px){.menu button{font-size:11px;letter-spacing:.04em;padding:8px 2px}}

/* ===== content ===== */
main{padding-block:18px 48px}
.panel{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:860px){.panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.span{grid-column:1/-1}.panel.one{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h2{font-size:20px;text-transform:uppercase;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card>h2 small,.card .subt{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.card .subt{margin-top:-8px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* secondary menu */
.submenu{display:flex;gap:6px;flex-wrap:wrap}
.submenu button{border:2px solid var(--gold);color:var(--golddark);border-radius:10px;padding:7px 14px;font-weight:700;font-size:13px}
.submenu button.on{background:var(--g-golddark);color:#fff;border-color:transparent}
.submenu button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--muted)}

/* specs */
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
@media (max-width:520px){.specs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.spec{border-left:3px solid var(--gold);padding-left:10px}
.spec span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.spec b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--navy)}
/* filters */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.filters.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.filters,.filters.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filt{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.filt .ic{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--blue);display:grid;place-items:center}
.filt .ic svg{width:16px;height:16px}
.filt label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.filt select{width:100%;border:0;background:transparent;font:inherit;font-weight:700;color:var(--navy);padding:0}
.filt.req select{color:var(--wred)}

/* stat grid */
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:var(--surface-2);border-radius:12px;padding:10px 8px;text-align:center}
.st b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--navy);line-height:1}
.st span{font-size:9px;display:block;hyphens:manual;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.st.g b{color:var(--golddark)}
.rankpill{background:var(--g-golddark);color:#fff;border-radius:999px;padding:3px 12px;font-family:var(--display);font-size:16px;letter-spacing:.06em}
.linkish{color:var(--blue);font-weight:700;font-size:12px;text-decoration:underline}

/* tables */
.scroller{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.table th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.table td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.table .tn{font-weight:700;color:var(--blue);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit;font-weight:700;text-align:left}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--surface-2);color:var(--navy)}
.tag.gold{background:var(--goldlight);color:var(--golddark)}
.tag.navy{background:var(--navy);color:#fff}
.tag.green{background:rgba(0,191,99,.15);color:#047a42}
.tag.red{background:rgba(249,75,90,.15);color:#b8303c}
.tag.blue{background:var(--lightblue);color:var(--blue)}
.wrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.wrow .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.wrow .ic svg{width:22px;height:22px}
.wrow .ic.blue{background:var(--g-navy)}.wrow .ic.gold{background:var(--g-golddark)}.wrow .ic.red{background:var(--g-burg)}
.wrow .amt{font-family:var(--display);font-size:26px;color:var(--navy);text-align:right;line-height:1}
.wrow .amt.neg{color:var(--burgundy)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn svg{width:16px;height:16px}
.btn.navy{background:var(--g-navy);color:#fff}
.btn.gold{background:var(--g-golddark);color:#fff}
.btn.green{background:var(--g-green);color:#fff}
.btn.red{background:var(--g-burg);color:#fff}
.btn.out{border:1.5px solid var(--line);color:var(--navy);background:#fff}
.btn.wide{width:100%;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.acc summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .pc{font-size:11px;color:var(--muted);font-weight:600}
.acc summary::after{content:"+";font-family:var(--display);font-size:22px;color:var(--golddark);line-height:1}
.acc[open] summary::after{content:"–"}
.acc .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:6px}
.f label .lock{display:inline-flex;align-items:center;gap:3px;color:var(--golddark);text-transform:none;letter-spacing:0;font-weight:600}
.f label .lock svg{width:11px;height:11px}
.f input,.f select{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
.f input:read-only,.f select:disabled{background:var(--surface-2);color:var(--muted)}
.f .hint{font-size:11px;color:var(--muted)}
.f .vis{display:flex;gap:4px}
.f .vis button{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--muted)}
.f .vis button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* progress */
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--g-golddark);border-radius:3px}

/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,50,93,.55);display:grid;place-items:end center;padding:0}
@media (min-width:700px){.modal{place-items:center;padding:24px}}
.modal .box{background:var(--bg);color:var(--text);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal .box{border-radius:22px;padding:22px}}
.modal .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal .head h3{font-size:24px;text-transform:uppercase;color:var(--navy);text-wrap:balance}
.modal .x{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.modal .x svg{width:16px;height:16px}
/* group stage card (reference design) */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.gcard .gh{background:var(--g-golddark);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:10px 14px;font-size:13px;font-weight:700}
.gcard .gh :last-child{text-align:right}
.gcard .gh .mid{text-align:center;font-weight:700}
.gcard .cols,.grow{display:grid;grid-template-columns:40px minmax(0,1fr) repeat(5,28px);gap:3px;align-items:center}
@media (min-width:520px){.gcard .cols,.grow{grid-template-columns:70px minmax(0,1fr) repeat(5,48px);gap:6px}.cell{font-size:18px}}
.gcard .cols{background:var(--navy);color:#fff;padding:8px 10px;font-size:10px;font-weight:700;text-align:center}
.gcard .cols span:nth-child(2){text-align:left}
.gcard .rows{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg)}
.grow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative}
.grow.me{border:2px solid var(--gold);background:linear-gradient(90deg,#fff 0%,var(--goldlight) 45%,#fff 100%)}
.pos{justify-self:center;background:var(--navy);color:#fff;border-radius:7px;padding:5px 5px;font-size:10.5px;font-weight:700;line-height:1;text-align:center}
.grow.me .pos{background:var(--g-navy)}
.players{display:flex;flex-direction:column;gap:6px;min-width:0}
.pl{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--navy);min-width:0}
.pl i{font-style:normal;line-height:1.15;overflow-wrap:anywhere}
i.full{display:none}i.short{display:inline}@media (min-width:520px){i.full{display:inline}i.short{display:none}.pl{font-size:13px}}
.pl .av{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:9px;font-weight:800;display:grid;place-items:center;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--gold)}
.pl .av.b{background:var(--blue);color:#fff;box-shadow:0 0 0 1px var(--blue)}
.cell{font-family:var(--display);font-size:15px;text-align:center;color:var(--navy);background:var(--surface-2);border-radius:7px;padding:6px 0;line-height:1}
.grow.me .cell{background:#fff}
.cell.w{color:var(--green)}.cell.l{color:var(--wred)}.cell.gdp{color:var(--green)}.cell.gdn{color:var(--wred)}
/* match card (reference design) */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.mcard .mh{background:var(--g-navy);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;padding:9px 12px;font-size:12px;font-weight:700;line-height:1.35}
.mcard .mh .c{text-align:center}.mcard .mh .r{text-align:right}
.mcard .mh small{display:block;font-weight:600;opacity:.9}
.mcard .stripe{height:4px}
.mcard.w .stripe{background:var(--green)}.mcard.l .stripe{background:var(--wred)}
.mcard .mb{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.mrow.me{border:2px solid var(--gold);background:linear-gradient(90deg,#fff 0%,var(--goldlight) 50%,#fff 100%)}
.sets{display:flex;gap:6px}
.set{width:40px;height:40px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--navy)}
.mrow.me .set{background:#fff;border:1px solid var(--line)}
.set.w{color:var(--green)}.set.l{color:var(--wred)}
.set.na{color:var(--line)}
.mlist{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.mlist{grid-template-columns:1fr 1fr}}
.roundlab{font-family:var(--display);font-size:16px;color:var(--navy);letter-spacing:.06em;text-transform:uppercase;grid-column:1/-1;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{text-align:center;font-size:11px;color:var(--muted);padding:16px}

/* ===== tournaments module ===== */
.proto{background:#0b1626;color:#cfd9e6;font-size:11px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:6px}
.proto b{color:var(--gold);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.proto label{display:flex;align-items:center;gap:4px}
.proto select{font:inherit;font-size:11px;background:#16243a;color:#fff;border:1px solid #2c3f5c;border-radius:6px;padding:2px 6px}
.proto .in{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;width:100%}
.proto .today{margin-left:auto;opacity:.65}
.logo{display:block}
.tl-l{display:flex;align-items:center;gap:10px}
.sitenav{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.2)}
.sitenav a{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:rgba(255,255,255,.8);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sitenav a svg{width:15px;height:15px}
.sitenav a.on{background:var(--gold);color:var(--navy)}
@media (max-width:480px){.sitenav a:not(.on) span{display:none}.sitenav a{padding:5px 9px}}
.me-av{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;flex:none;display:block}
.me-av img{width:100%;height:100%;object-fit:cover}
.signin{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);border-radius:999px;padding:9px 14px;font-weight:700;font-size:12px;color:#fff;white-space:nowrap}
.menu button{position:relative}
.menu button:disabled{opacity:.38;cursor:not-allowed}
.menu button .lk{position:absolute;top:5px;right:6px;width:12px;height:12px;display:grid}
.menu button .lk svg{width:12px;height:12px}
@keyframes blink{50%{opacity:.25}}

/* status chips */

.chip.st-full{background:rgba(136,41,41,.12);color:var(--burgundy)}

.chip.st-done{background:var(--navy);color:#fff}
.chip.tm-canceled{background:rgba(249,75,90,.14);color:#b8303c}
.band .chip.st-done{background:#fff;color:var(--navy)}
.band .chip.st-open{background:var(--green);color:#fff}.band .chip.st-closing{background:var(--gold);color:var(--navy)}.band .chip.st-full{background:var(--burgundy);color:#fff}.band .chip.st-closed{background:#e3e9f1;color:var(--navy)}
.hl .chip{border:0;border-radius:999px;padding:4px 10px 4px 8px;font-size:10px;font-weight:800}
.st-open{--c:var(--green)}.st-closing{--c:var(--gold)}.st-full{--c:var(--burgundy)}.st-closed{--c:#9aa7b8}.st-live{--c:var(--wred)}.st-done{--c:var(--navy)}

/* hero slider */
.hs{position:relative;margin-top:18px;z-index:1}

@media (max-width:520px){.tc .info{padding:9px 10px;gap:4px}.tc h3{font-size:16px}.tc .meta{font-size:10.5px}.sbm div{padding:5px 6px}.sbm span{font-size:7.5px}.sbm b{font-size:15px}.tc .tag{font-size:9px;padding:2px 5px}}

/* calendar */
.calw{display:flex;flex-direction:column;gap:10px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}

.calh button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.calh button:disabled{opacity:.3;cursor:default}
.calh svg{width:16px;height:16px}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow span{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0 6px;display:flex;flex-direction:column;gap:3px;min-width:0}

.agi .dt{display:flex;flex-direction:column;align-items:center;background:var(--g-navy);color:#fff;border-radius:8px;padding:4px 0;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

@media (max-width:699px){.day{min-height:54px;cursor:pointer}.day.sel{background:var(--goldlight)}.ev{height:6px;padding:0;margin:0 3px;border-left:0;border-radius:3px;background:var(--c)}.ev.s{border-radius:3px 0 0 3px;margin-right:-1px}.ev.m{border-radius:0;margin:0 -1px}.ev.e{border-radius:0 3px 3px 0;margin-left:-1px}.ev .n,.ev .chip{display:none}.agenda{display:flex}}

.thead{display:flex;flex-direction:column;gap:10px;min-width:0}

.mcard.live .stripe{background:var(--wred)}
.phl{display:block;font-size:12px;color:var(--muted);font-style:italic;border:1px dashed #c3d0df;border-radius:8px;padding:6px 8px}
.lvtxt{display:inline-flex;align-items:center;background:var(--wred);color:#fff;border-radius:999px;padding:0 7px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.6}

/* knockouts bracket */
.swipe{margin:0;font-size:11px;text-align:center}
@media (min-width:780px){.swipe{display:none}}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:0 28px;min-width:720px;padding:2px 2px 8px}
.bcol{display:flex;flex-direction:column;gap:8px}
.bcol h4,.third h4{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:0}
.bpairs{flex:1;display:flex;flex-direction:column}
.pair{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.pair>.bnode{margin:7px 0}
.pair:not(.one)::after{content:"";position:absolute;right:-15px;top:25%;bottom:25%;width:14px;border:2px solid #c3d0df;border-left:0;border-radius:0 8px 8px 0}
.bcol+.bcol .bnode::before{content:"";position:absolute;left:-15px;top:50%;width:14px;border-top:2px solid #c3d0df}
.bnode{background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative;box-shadow:var(--shadow)}
.bnode .bh{display:flex;justify-content:space-between;gap:8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--navy);color:#fff;padding:5px 10px;border-radius:11px 11px 0 0}
.bnode.live{border-color:var(--wred)}
.bnode.hit{outline:3px solid var(--blue);outline-offset:2px}
.bnode.dim{opacity:.35}
.bt{display:grid;grid-template-columns:36px minmax(0,1fr) 24px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.bt:last-child{border-radius:0 0 11px 11px}
.bt .seed{font-size:9.5px;font-weight:800;letter-spacing:.02em;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:3px 0;text-align:center}
.bt .sc{font-family:var(--display);font-weight:400;font-size:19px;color:var(--navy);text-align:center}
.bt.win{background:rgba(0,191,99,.06)}
.bt.win .sc{color:var(--green)}
.bt.me{background:linear-gradient(90deg,#fff,var(--goldlight))}
.third{display:flex;flex-direction:column;gap:8px;max-width:340px;margin-top:6px}

/* winners */
.wlist{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:860px){.wlist{grid-template-columns:1fr 1fr}.wcard.p1{grid-column:1/-1}}
.wcard{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.wcard .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:19px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.wcard.p1{background:var(--g-navy);border-color:transparent;color:#fff}
.wcard.p1 .medal{background:var(--g-golddark)}
.wcard.p2 .medal{background:linear-gradient(135deg,#7d8a9c,#cfd6df)}
.wcard.p3 .medal{background:linear-gradient(135deg,#8a5a2b,#d29a63)}
.wcard.p4 .medal{background:var(--surface-2);color:var(--navy)}
.wcard.p1 .kicker{color:var(--gold)}
.wcard.p1 .pl{color:#fff}
.wcard.me:not(.p1){border:2px solid var(--gold)}
.wcard .wb{display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .wp{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.wcard .wp b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--golddark);line-height:1;white-space:nowrap}
.wcard.p1 .wp b{color:var(--gold);font-size:30px}
.wcard .wp b small{font-size:12px;margin-left:3px;color:var(--muted)}
.wcard.p1 .wp b small{color:#fff}
.wcard .linkish{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.wcard .linkish svg{width:14px;height:14px}
.wcard.p1 .linkish{color:var(--goldlight)}
.wphoto{position:relative;border-radius:var(--r);overflow:hidden;border:3px solid var(--gold)}
.wphoto img{width:100%;aspect-ratio:4/3;object-fit:cover}
.wphoto .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(2,50,93,.85);padding:10px 12px}
.wphoto .cap .pl{color:#fff}

/* mega: venues · prizes · levels */
.vlist,.plv{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 10px}
.vrow .ic{width:40px;height:40px;border-radius:10px;background:var(--g-navy);color:var(--gold);display:grid;place-items:center}
.vrow .ic svg{width:20px;height:20px}
.vrow b{display:block;color:var(--navy)}.vrow small{color:var(--muted);font-size:12px}
.plrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.plrow:last-child{border-bottom:0}
.plrow .muted{font-size:12px;font-weight:600}
.plrow b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--golddark);white-space:nowrap}
.plrow b small{font-size:11px;color:var(--muted);margin-left:3px}
.plrow:hover .tag{background:var(--blue);color:#fff}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s}
.lcard:hover{transform:translateY(-2px)}
.lcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--g-navy)}
.lcard.women::before{background:var(--g-red)}.lcard.mixed::before{background:var(--g-green)}.lcard.rookies::before{background:var(--g-goldlight)}
.lcard .lt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lcard h3{font-size:28px;line-height:1;text-transform:uppercase;color:var(--navy)}
.lcard .pz{display:flex;align-items:baseline;gap:6px;margin-top:-4px}
.lcard .pz b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--golddark);line-height:1}
.lcard .pz small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lcard .lm{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.lcard .lm span{display:flex;align-items:center;gap:6px}
.lcard .lm svg{width:14px;height:14px;color:var(--blue);flex:none}
.lcard .go{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.lcard .go svg{width:14px;height:14px}

/* registration modal */
.modal .head h3 small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:4px}
.rb{display:flex;flex-direction:column;gap:12px}
.btns.end{justify-content:flex-end}
.btns.split{justify-content:space-between}
.hint{font-size:11.5px;color:var(--muted);margin-top:-6px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;width:100%}
.prow:hover{border-color:var(--gold)}
.prow.sel{border:2px solid var(--gold);background:linear-gradient(90deg,#fff,var(--goldlight));padding:8px 9px}
.prow img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.prow b{display:block;color:var(--navy);font-size:13.5px}
.prow small{color:var(--muted);font-size:11.5px}
.sosn{display:flex;flex-direction:column;align-items:center;background:var(--g-navy);border-radius:10px;padding:4px 10px;color:#fff;min-width:52px}
.sosn b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold);line-height:1}
.sosn small{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#fff;opacity:.85}
.due{background:var(--g-navy);color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.due::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(216,179,85,.3),transparent 65%);pointer-events:none}
.due span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.9}
.due b{display:block;font-family:var(--display);font-weight:400;font-size:44px;color:var(--gold);line-height:1}
.due b small{font-size:16px;color:#fff;margin-left:6px;opacity:.85}
.due .brk{font-size:12px;opacity:.85}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.opt:hover{border-color:var(--gold)}
.opt.on{border-color:var(--gold);background:var(--g-goldsoft);box-shadow:0 0 0 3px rgba(216,179,85,.2)}
.opt .ic{width:40px;height:40px;border-radius:10px;background:var(--g-navy);color:#fff;display:grid;place-items:center;margin-bottom:4px}
.opt .ic.gold{background:var(--g-golddark)}
.opt .ic svg{width:22px;height:22px}
.opt b{color:var(--navy);font-size:14px}.opt small{color:var(--muted);font-size:11.5px}
.pms{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:700px){.pms{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pm{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.pm .lg{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em}
.pmb{display:flex;flex-direction:column;gap:4px;min-width:0}
.pmb>b{color:var(--navy)}
.pmb dl{margin:0;display:grid;gap:2px;font-size:12px}
.pmb dt{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pmb dd{margin:0 0 4px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.cp{display:grid;place-items:center;color:var(--blue)}.cp svg{width:14px;height:14px}
.pmb .linkish{display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.pmb .linkish svg{width:13px;height:13px}
.upl{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #c3d0df;border-radius:14px;padding:18px;text-align:center;background:var(--surface);cursor:pointer;position:relative;color:var(--muted)}
.upl:hover{border-color:var(--gold)}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.upl .ic{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--navy)}
.upl .ic svg{width:22px;height:22px}
.upl b{color:var(--navy);font-size:13px}.upl small{font-size:11.5px}
.upl.has{flex-direction:row;text-align:left;border-style:solid;border-color:var(--green);background:#f1fbf6;padding:10px 12px}
.upl.has img{width:56px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.upl.has span{display:flex;flex-direction:column}
.wbal{display:grid;grid-template-columns:44px minmax(0,1fr) 124px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.wbal .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.wbal .ic svg{width:22px;height:22px}
.wbal .ic.blue{background:var(--g-navy)}.wbal .ic.gold{background:var(--g-golddark)}
.wbal>div>b{display:block;color:var(--navy);font-size:13.5px}
.wbal small{color:var(--muted);font-size:11.5px}
.wbal small b{color:var(--green)}
.amt{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.amt:focus-within{border-color:var(--gold)}
.amt input{width:100%;min-width:0;border:0;font:inherit;font-family:var(--display);font-size:20px;color:var(--navy);padding:7px 0;text-align:right;background:transparent}
.amt input:focus{outline:none}
.amt span{font-size:11px;font-weight:700;color:var(--muted)}
.remain{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 14px}
.remain>span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.remain b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--navy);line-height:1}
.remain b small{font-size:12px;color:var(--muted);margin-left:4px}
.okmsg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 0}
.okmsg .big{width:72px;height:72px;border-radius:50%;background:var(--g-green);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,191,99,.3)}
.okmsg .big svg{width:36px;height:36px}
.okmsg h3{font-size:28px;text-transform:uppercase;color:var(--navy);line-height:1.05}
.okmsg p{margin:0;font-size:13px;color:var(--muted)}

.testtag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:var(--golddark);background:#fff;border:1px dashed var(--gold);border-radius:6px;padding:2px 6px}
.prow.ineligible{opacity:.55;cursor:not-allowed;background:var(--bg)}
.prow .el{display:block;font-weight:700;margin-top:2px}.prow .el.ok{color:var(--green)}.prow .el.no{color:var(--wred)}
/* looking for a partner */
.intro{margin:0;font-size:13px}
.pcards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.pcards{grid-template-columns:1fr 1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pcard.me{border:2px solid var(--gold)}
.pcard .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--g-navy);color:#fff}
.pcard .ph img{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;flex:none}
.pcard .ph b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;flex:1;min-width:0}
.pcard .pb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;padding:10px 12px;align-items:center}
.pcard .pb span{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pcard .pb b{font-size:13px;color:var(--navy)}
.pcard .sosv{background:var(--g-navy);border-radius:10px;padding:5px 10px;text-align:center}
.pcard .sosv span{color:#fff;opacity:.85}
.pcard .sosv b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold);line-height:1}
.pcard .pf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px 12px;margin-top:auto}
.pcard .ct{display:flex;gap:8px}
.ci{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ci svg{width:18px;height:18px}
.ci.tel{background:var(--g-navy)}.ci.wa{background:#25d366}
.lfpfoot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;text-align:center}
.lfpfoot>.muted{font-size:12px;font-weight:600}
</style>
</head>

function seeded(s){let h=2166136261>>>0;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;return()=>{h=h+0x6D2B79F5>>>0;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

  return {g,court:gi+1,teams:ts,ms:RR.map(([x,y],i)=>({a:{t:ts[x]},b:{t:ts[y]},full:play(ts[x],ts[y]),time:tm(o.time,i*30),court:gi+1}))};});

   a.P++;b.P++;a.GF+=sc[0];b.GF+=sc[1];a.GD+=sc[0]-sc[1];b.GD+=sc[1]-sc[0];(aw?a:b).W++;(aw?b:a).L++;(aw?a:b).Pts+=3;});

 qf.forEach(x=>x.res=ko(x.a.full,x.b.full));
 const sf=[[0,1],[2,3]].map(([i,j],k)=>({lab:'SF '+(k+1),a:{seed:'W·QF'+(i+1),ph:'Winner QF '+(i+1),full:qf[i].res.w,src:qf[i]},b:{seed:'W·QF'+(j+1),ph:'Winner QF '+(j+1),full:qf[j].res.w,src:qf[j]},time:tm(kt,45),court:k+1}));

 const f={lab:'Final',a:{seed:'W·SF1',ph:'Winner SF 1',full:sf[0].res.w,src:sf[0]},b:{seed:'W·SF2',ph:'Winner SF 2',full:sf[1].res.w,src:sf[1]},time:tm(kt,90),court:1};

function calendar(list){const y=S.season,m=(S.month==='all'?TODAY.getMonth()+1:S.month)-1,first=new Date(y,m,1),last=new Date(y,m+1,0),off=(first.getDay()+6)%7,n=Math.ceil((off+last.getDate())/7)*7;
 const ev=list.filter(t=>D(t.start)<=last&&D(t.end)>=first).sort((a,b)=>a.start.localeCompare(b.start)||b.end.localeCompare(a.end)||a.id.localeCompare(b.id));   // longer spans first keeps multi-day bars on one row

 <div class="agenda"><div class="agh"><b>${S.calDay?day(S.calDay):'All of '+MONL[m]}</b>${S.calDay?'<button class="linkish" id="calAll">Whole month</button>':''}</div>
 ${ag.length?ag.map(t=>`<a class="agi" href="#/t/${t.id}"><span class="dt"><b>${D(t.start).getDate()}</b>${MON[D(t.start).getMonth()]}</span><span class="nm"><b>${t.n}</b><small>${when(t)} · ${t.type==='mega'?t.levels.length+' levels':lvName(t)}</small></span>${chip(stat(t))}</a>`).join(''):`<p class="muted" style="margin:0;font-size:13px">No ${S.tab} tournaments ${S.calDay?'on this day':'this month'}.</p>`}</div></div>`;}

function myTeam(o){const st=S.reg[o.key],pc=S.partner[o.key]||'BC-00871',p=PL[pc],[a,mx]=sosOf(o),s=stat(o),can=phase(s)==='reg'&&s!=='closed';

 <div class="card"><h2>About</h2><p class="desc">${desc(o)}</p></div>
 <div class="card"><h2>Venues <small>${o.vens.length}</small></h2><div class="vlist">${o.vens.map(v=>`<div class="vrow"><span class="ic">${I.pin}</span><div><b>${VEN[v][0]}</b><small>${VEN[v][1]} · ${VEN[v][2]} courts</small></div><button class="linkish" data-toast="Opens ${VEN[v][0]} in Maps">Map</button></div>`).join('')}</div></div>
 <div class="card span"><h2>Prize pool per level</h2><div class="plv">${o.levels.map(l=>`<a class="plrow" href="#/t/${o.id}/${l.id}"><span class="tag blue">${l.n}</span><span class="muted">${when(l)} · ${VEN[l.ven][0]}</span><b class="num">${egp(l.prize)}<small>EGP</small></b></a>`).join('')}</div></div></div>`;}
function pGuide(o){const acc=(t,pc,body,open)=>`<details class="acc" ${open?'open':''}><summary>${t}<span class="pc">${pc}</span></summary><div class="body">${body}</div></details>`;
 return `<div class="panel one">${acc('Rules','On court',`<ul class="ul"><li>Every match is one long set to 6 games with golden point at deuce; tie-break at 6–6.</li><li>10-minute warm-up. A team more than 15 minutes late loses by walkover.</li><li>Your SoS is checked again at check-in and must still fit the level’s limits.</li><li>Balls are provided. Court shoes only.</li></ul>`,true)}
 ${acc('Format','Groups → knockouts',`<ul class="ul"><li>Each level is its own 16-team tournament: four groups of four, round robin.</li><li>3 points per win. Ties are split by game difference, then games won, then head-to-head.</li><li>The top two of each group play the quarter-finals; single elimination from there, plus a 3rd-place play-off.</li></ul>`)}
 ${acc('Schedule',`${o.levels.length} levels`,`<div class="scroller"><table class="table" style="min-width:440px"><thead><tr><th>Level</th><th>Dates</th><th>Venue</th><th class="r">Starts</th></tr></thead><tbody>${[...o.levels].sort(byStart).map(l=>`<tr><td><span class="tag blue">${l.n}</span></td><td class="num">${when(l)}</td><td>${VEN[l.ven][0]}</td><td class="r num">${l.time}</td></tr>`).join('')}</tbody></table></div>`)}
 ${acc('FAQs','4 questions',[['Can I play more than one level?','Yes, if the dates don’t overlap and your team fits each level’s SoS limits.'],['Can I change my partner?','Request a cancellation in Teams → My Team, then register again with your new partner before registration closes.'],['When do I get a refund?','Refunds follow the refund disclaimer and land in your Tournaments Credit within 48 hours.'],['How are rankings updated?','When a level is marked complete, points are added to every player’s ranking and the result appears in their profile history.']].map(([q,a])=>`<div class="faq"><b>${q}</b><span>${a}</span></div>`).join(''))}</div>`;}
function pLevels(o){return `<div class="lvls">${o.levels.map(l=>{const [a,m]=sosOf(l);return `<a class="lcard ${l.cat}" href="#/t/${o.id}/${l.id}"><div class="lt"><h3>${l.n}</h3>${chip(stat(l))}</div><div class="pz"><b class="num">${egp(l.prize)}</b><small>EGP prize</small></div><div class="lm"><span>${I.cal}${when(l)} · ${l.time}</span><span>${I.pin}${VEN[l.ven][0]} · ${VEN[l.ven][1]}</span><span>${I.level}SoS avg ≤ ${a.toFixed(1)} · max ≤ ${m.toFixed(1)}</span></div><span class="go">Open level${I.chevR}</span></a>`;}).join('')}</div>`;}

/* ---------- flow: register your team ---------- */
function authGate(){const md=modal('Sign in to continue',`<p class="muted" style="margin:0;font-size:13px">Registration, My Team and Looking For A Partner need a Bassio account.</p><div class="btns end"><button class="btn out" data-close data-toast="Sign-up flow (prototype)">Create account</button><button class="btn navy" id="gIn">Sign in</button></div>`);
 md.querySelector('#gIn').onclick=()=>{md.remove();S.auth=true;renderAll();toast('Signed in as Bassio');};}
const REAL_ME={sos:4.5,g:'M'};
function fitMe(o){const [cap,mx]=sosOf(o);if(S.sosMode==='auto'){ME.sos=Math.min(REAL_ME.sos,+(cap-0.3).toFixed(1));ME.g=o.cat==='women'?'F':o.cat==='mixed'?'M':REAL_ME.g;ME.fitted=ME.sos!==REAL_ME.sos||ME.g!==REAL_ME.g;}else{ME.sos=REAL_ME.sos;ME.g=REAL_ME.g;ME.fitted=false;}}
function openReg(o,step){if(!S.auth)return authGate();fitMe(o);R={o,step:step||1,code:step===2?S.partner[o.key]:null,qv:'',m:null,cr:0,sv:0,proof:null,rest:false};
 R.md=modal(`Register Your Team<small>${title(o)}</small>`,'<div class="rb" id="rb"></div>',()=>{R=null;});regRender();}
function regRender(){const b=R.md.querySelector('#rb');b.innerHTML=[regA,regB,regC][R.step-1]();wire(b);regBind(b);R.md.querySelector('.box').scrollTop=0;}
const steps=n=>`<ol class="steps">${['Partner','Payment','Confirmation'].map((l,i)=>`<li class="${i+1<n?'done':i+1===n?'on':''}">${l}</li>`).join('')}</ol>`;
const prow=(c,sel)=>{const p=PL[c],e=R&&R.o?elig(R.o,p):null,ok=!e||e.ok;const why=e&&!e.ok?e.r[0].replace(/^Your team average/,'Team average').replace(/ is above this level’s (\S+) (maximum per player|limit)\.?$/,' > $1'):'';
 return `<button class="prow ${sel?'sel':''} ${ok?'':'ineligible'}" data-code="${c}" ${ok?'':'disabled'}><img src="${avOf(p)}" alt=""><span><b>${p.n}</b><small>${c} · ${p.g==='F'?'Female':'Male'} · ${p.side} side</small>${e?`<small class="el ${ok?'ok':'no'}">${ok?'Eligible · team avg '+e.a.toFixed(2):'Not eligible · '+why}</small>`:''}</span><span class="sosn"><b>${p.sos.toFixed(1)}</b><small>SoS</small></span></button>`;};
function eligNote(o,p,e){const [a,m]=sosOf(o),f=n=>n.split(' ')[0];
 return e.ok?`<div class="note green">${I.check}<div><b>Eligible team</b>${f(ME.n)} ${ME.sos.toFixed(1)} + ${f(p.n)} ${p.sos.toFixed(1)} → team average ${e.a.toFixed(2)} (limit ${a.toFixed(1)}), and both players are within the ${m.toFixed(1)} maximum.</div></div>`
 :`<div class="note red">${I.alert}<div><b>This team is not eligible</b><ul>${e.r.map(x=>`<li>${x}</li>`).join('')}</ul>Please choose another partner who fits ${lvName(o)}.</div></div>`;}
function rSearch(v){const t=v.trim();if(!t)return '';const c=t.toUpperCase().replace(/^(BC)?-?(\d{5})$/,'BC-$2');
 if(c===ME.code)return `<div class="note red">${I.alert}<div>That’s your own referral code. Enter your partner’s code.</div></div>`;
 if(PL[c])return `<div class="kicker">Search result</div>${prow(c,c===R.code)}`;
 return c.replace(/\W/g,'').length>=7?`<div class="note red">${I.alert}<div><b>No player found</b>No account uses “${esc(t)}”. Your partner needs a Bassio account before you can team up.</div></div>`:'';}
function regA(){const o=R.o,p=R.code&&PL[R.code],e=p&&elig(o,p);
 const [cap,mx]=sosOf(o),meLocked=ME.sos>mx||(o.cat==='women'&&ME.g!=='F');
 return `${steps(1)}${meLocked?`<div class="note red">${I.alert}<div><b>This level is locked for you</b>${o.cat==='women'&&ME.g!=='F'?'Women levels are open to female players only.':`Your SoS ${ME.sos.toFixed(1)} is above ${lvName(o)}’s ${mx.toFixed(1)} maximum per player, so no partner can make this team eligible.`} Pick a higher level, or ask the admins to review your SoS.</div></div>`:`<div class="note">${I.info}<div><b>${lvName(o)} limits</b> Team average ≤ ${cap.toFixed(1)} · each player ≤ ${mx.toFixed(1)}. You are ${ME.sos.toFixed(1)}, so a partner up to ${Math.min(mx,cap*2-ME.sos).toFixed(1)} keeps the team eligible.${ME.fitted?` <span class="testtag">Test mode · your SoS is set to ${ME.sos.toFixed(1)}${ME.g!==REAL_ME.g?' and gender to '+(ME.g==='F'?'female':'male'):''} for this level so you can try the flow</span>`:''}</div></div>`}<div class="card"><h2>Select a partner</h2><label class="search">${I.search}<input id="rq" placeholder="Partner’s referral code · e.g. BC-01377" autocomplete="off" spellcheck="false" aria-label="Partner referral code"></label><span class="hint">Every player’s referral code is on their profile, under their name.</span><div id="rres"></div>
 <div class="kicker">Previous partners <span class="muted" style="font-weight:500;text-transform:none;letter-spacing:0">· eligible first</span></div><div class="plist">${[...PREV].sort((x,y)=>(elig(o,PL[y]).ok?1:0)-(elig(o,PL[x]).ok?1:0)).map(c=>prow(c,c===R.code)).join('')}</div></div>
 ${e?eligNote(o,p,e):''}<div class="btns end"><button class="btn out" data-close>Cancel</button><button class="btn gold" id="rNext" ${e&&e.ok?'':'disabled'}>Next${I.chevR}</button></div>`;}
function transferPart(amt){return `<div class="kicker">Send EGP ${egp(amt)} with any of these</div><div class="pms">${PM.map(([n,ab,bg,rows,link])=>`<div class="pm"><span class="lg" style="background:${bg}" title="${n} logo">${ab}</span><div class="pmb"><b>${n}</b><dl>${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}<button class="cp" data-cp="${v}" aria-label="Copy ${k}">${I.copy}</button></dd></div>`).join('')}</dl>${link?`<button class="linkish" data-toast="Opens Instapay with the amount filled in">${I.ext}${link}</button>`:''}</div></div>`).join('')}</div>
 <div class="kicker">Proof of payment</div><label class="upl ${R.proof?'has':''}"><input type="file" accept="image/*" id="rFile">${R.proof?`<img src="${R.proof}" alt="Payment screenshot preview"><span><b>Screenshot attached</b><small>Tap to replace it</small></span>`:`<span class="ic">${I.upload}</span><b>Upload a screenshot of your transfer</b><small>JPG or PNG · amount, date and reference visible</small>`}</label>
 ${R.proof?`<button class="btn gold wide" id="rDone">${I.check}Complete Registration</button>`:`<button class="linkish" id="rSample" style="align-self:center">Use a sample screenshot (prototype)</button>`}`;}
const wAct=rest=>rest===0?`<button class="btn gold wide" id="rDone">${I.check}Complete Registration</button>`:`<button class="btn navy wide" id="rRestBtn">Next · pay EGP ${egp(rest)} by transfer${I.chevR}</button>`;
function walletPart(rest){const row=(id,ic,cls,t,bal,v)=>`<div class="wbal"><span class="ic ${cls}">${I[ic]}</span><div><b>${t}</b><small>Available <b class="num">+${bal}</b> EGP</small></div><label class="amt"><input id="${id}" type="number" inputmode="numeric" min="0" max="${bal}" step="50" value="${v||''}" placeholder="0" aria-label="Amount from ${t}"><span>EGP</span></label></div>`;
 return `<div class="kicker">Redeem from your balances</div>${row('wCr','trophy','blue','Tournaments Credit',500,R.cr)}${row('wSv','wallet','gold','My Savings',650,R.sv)}<div class="remain"><span>Remaining due</span><b class="num"><span id="rRest">${egp(rest)}</span><small>EGP</small></b></div><div id="wAct">${wAct(rest)}</div>`;}
function regB(){const o=R.o,fee=o.fee,rest=fee-R.cr-R.sv,amt=R.rest?rest:fee;
 return `${steps(2)}<div class="due"><span>${R.rest?'Remaining due':'Total due amount'}</span><b class="num">${egp(amt)}<small>EGP</small></b><div class="brk">${R.rest?`EGP ${egp(fee)} team fee − ${egp(R.cr)} Tournaments Credit − ${egp(R.sv)} My Savings`:`Team fee · ${title(o)} · with ${PL[R.code].n}`}</div></div>
 ${R.rest?'':`<div class="kicker">How would you like to pay?</div><div class="choice"><button class="opt ${R.m==='transfer'?'on':''}" data-m="transfer"><span class="ic">${I.bank}</span><b>Money Transfer</b><small>Instapay · Telda · Wallet</small></button><button class="opt ${R.m==='wallet'?'on':''}" data-m="wallet"><span class="ic gold">${I.wallet}</span><b>My Wallet</b><small>Credit 500 · Savings 650 EGP</small></button></div>`}
 ${R.m==='transfer'||R.rest?transferPart(amt):R.m==='wallet'?walletPart(rest):''}<div class="btns"><button class="btn out" id="rBack">${I.chevL}Back</button></div>`;}
function regC(){const o=R.o,p=PL[R.code],f=n=>n.split(' ')[0];
 return `${steps(3)}<div class="okmsg"><span class="big">${I.check}</span><h3>Welcome aboard, ${f(ME.n)} &amp; ${f(p.n)}!</h3><p>Your team is registered for <b>${title(o)}</b>.</p></div>
 <div class="note">${I.clock}<div><b>Awaiting Admin’s Approval</b>An admin checks your payment, usually within 24 hours. Track your team status any time in Teams → My Team.</div></div>
 <div class="card"><dl class="dl"><dt>Partner</dt><dd>${p.n} · ${R.code}</dd><dt>Paid with</dt><dd>${S.paid[o.key]}</dd><dt>Amount</dt><dd>EGP ${egp(o.fee)}</dd></dl></div>
 <div class="btns end"><button class="btn out" data-close>Done</button><button class="btn gold" id="rTrack">${I.users}Track in My Team</button></div>`;}
function regBind(b){const o=R.o,fee=o.fee,q=s=>b.querySelector(s),pick=()=>b.querySelectorAll('[data-code]').forEach(x=>x.onclick=()=>{R.code=x.dataset.code;regRender();});
 const rq=q('#rq');if(rq){rq.value=R.qv;q('#rres').innerHTML=rSearch(R.qv);rq.oninput=()=>{R.qv=rq.value;q('#rres').innerHTML=rSearch(rq.value);pick();};}
 pick();
 if(q('#rNext'))q('#rNext').onclick=()=>{R.step=2;regRender();};
 if(q('#rBack'))q('#rBack').onclick=()=>{if(R.rest){R.rest=false;R.proof=null;}else R.step=1;regRender();};
 b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{R.m=x.dataset.m;R.rest=false;R.proof=null;regRender();});
 const fl=q('#rFile');if(fl)fl.onchange=()=>{const f=fl.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{R.proof=rd.result;regRender();};rd.readAsDataURL(f);};
 if(q('#rSample'))q('#rSample').onclick=()=>{R.proof=SAMPLE;regRender();};
 const act=()=>{if(q('#rDone'))q('#rDone').onclick=complete;if(q('#rRestBtn'))q('#rRestBtn').onclick=()=>{R.rest=true;regRender();};};act();
 const cr=q('#wCr'),sv=q('#wSv');if(cr){const upd=()=>{let c=Math.max(0,Math.min(500,fee,+cr.value||0)),s=Math.max(0,Math.min(650,fee-c,+sv.value||0));
  if((+cr.value||0)!==c)cr.value=c||'';if((+sv.value||0)!==s)sv.value=s||'';R.cr=c;R.sv=s;q('#rRest').textContent=egp(fee-c-s);q('#wAct').innerHTML=wAct(fee-c-s);act();};cr.oninput=upd;sv.oninput=upd;}
 if(q('#rTrack'))q('#rTrack').onclick=()=>{R.md._close();S.pt='teams';S.sub='my';renderMenu();renderMain();window.scrollTo({top:$('.menu').offsetTop-8,behavior:'smooth'});};}
function complete(){const o=R.o;S.reg[o.key]='pending';S.partner[o.key]=R.code;delete S.why[o.key];
 S.paid[o.key]=R.m==='wallet'?(R.rest?'My Wallet + Money Transfer':'My Wallet'):'Money Transfer';R.step=3;regRender();renderAll();}
function cancelModal(o){const md=modal('Request cancellation?',`<p class="muted" style="margin:0;font-size:13px">Your team leaves ${title(o)} once an admin confirms the request.</p><div class="note">${I.alert}<div><b>Refund disclaimer</b>${REFUND}</div></div><div class="btns end"><button class="btn out" data-close>Keep my team</button><button class="btn red" id="cOk">Request cancellation</button></div>`);
 md.querySelector('#cOk').onclick=()=>{S.reg[o.key]='canceled';S.why[o.key]=`Canceled at your request · EGP ${egp(o.fee)} goes back to your Tournaments Credit under the refund disclaimer.`;md.remove();renderAll();toast('Cancellation requested');};}
function photoModal(o,i){const t=draw(o).winners[i];modal(`${['Champions','Runners-up','Third place','Fourth place'][i]}<small>${title(o)}</small>`,`<div class="wphoto"><img src="${cover(o)}" alt=""><div class="cap">${players(t)}</div></div><p class="muted" style="margin:0;font-size:12px">Placeholder · the admins upload the podium photo after the final.</p><div class="btns end"><button class="btn navy" data-toast="Photo saved (prototype)">${I.download}Download</button></div>`);}

/* ---------- flow: looking for a partner ---------- */
function openLfp(o){if(!S.auth)return authGate();const md=modal(`Looking For A Partner<small>${title(o)}</small>`,'<div class="rb" id="lb"></div>');
 const paint=()=>{const b=md.querySelector('#lb');b.innerHTML=lfpBody(o);wire(b);
  const j=b.querySelector('#lJoin');if(j)j.onclick=()=>{b.querySelector('#lfoot').innerHTML=`<div class="note">${I.alert}<div><b>Your contact info will be visible</b>Players browsing this list will see your name, age, gender, SoS score, court side, phone and WhatsApp number.</div></div><div class="btns end"><button class="btn out" id="lNo">Cancel</button><button class="btn gold" id="lOk">${I.check}Confirm &amp; join</button></div>`;
   b.querySelector('#lNo').onclick=paint;b.querySelector('#lOk').onclick=()=>{S.lfp[o.key]=true;paint();toast('You’re on the list');};};
  const lv=b.querySelector('#lLeave');if(lv)lv.onclick=()=>{delete S.lfp[o.key];paint();toast('You left the list');};};paint();}
function lfpBody(o){const list=[...(S.lfp[o.key]?[ME.code]:[]),...LFP];
 const card=c=>{const mine=c===ME.code,p=mine?ME:PL[c],e=mine?null:elig(o,p);
  return `<div class="pcard ${mine?'me':''}"><div class="ph"><img src="${mine?A.PHOTO:avOf(p)}" alt=""><b>${p.n}</b>${mine?'<span class="tag gold">You</span>':''}</div><div class="pb"><div><span>Age</span><b>${p.age}</b></div><div><span>Gender</span><b>${p.g==='F'?'Female':'Male'}</b></div><div><span>Court side</span><b>${p.side}</b></div><div class="sosv"><span>SoS</span><b>${p.sos.toFixed(1)}</b></div></div>
  <div class="pf">${e?`<span class="tag ${e.ok?'green':''}">${e.ok?'Eligible with you':'Not eligible with you'}</span>`:'<span class="muted" style="font-size:12px">Visible to other players</span>'}${mine?'':`<span class="ct"><a class="ci tel" href="tel:+201000000000" aria-label="Call ${p.n}">${I.phone}</a><a class="ci wa" href="https://wa.me/201000000000" target="_blank" rel="noopener" aria-label="WhatsApp ${p.n}">${I.wa}</a></span>`}</div></div>`;};
 return `<p class="muted intro">Players below enrolled themselves and are looking for a partner for this tournament. Reach out directly, then register together.</p><div class="pcards">${list.map(card).join('')}</div>
 <div class="lfpfoot" id="lfoot">${S.lfp[o.key]?`<div class="note green">${I.check}<div><b>You’re on the list</b>Other players can now see your card and contact you.</div></div><button class="btn out" id="lLeave">Leave the list</button>`:`<span class="muted">Can’t find a good match?</span><button class="btn gold wide" id="lJoin">${I.partner}Join The List</button>`}</div>`;}

/* ---------- render ---------- */
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');if(p[0]==='t'){const t=byId(p[1]);if(t){if(t.type==='mega'&&p[2]){const l=t.levels.find(x=>x.id===p[2]);if(l)return {k:'level',o:l,m:t};}return {k:t.type,o:t};}}return {k:'home'};}
function renderProto(){const c=CUR,o=c.o;
 $('#proto').innerHTML=`<div class="in"><b>Prototype controls</b><label>Page <select id="pcPage"><option value="app.html">Player Profile</option><option value="" selected>Tournaments</option></select></label><label>Signed in <select id="pcAuth">${opt(1,'Yes',+S.auth)}${opt(0,'No',+S.auth)}</select></label><label>My SoS <select id="pcSos">${opt('auto','Auto · fits every level (testing)',S.sosMode)}${opt('real','4.5 · real rules',S.sosMode)}</select></label>
 ${o?`<label>Stage <select id="pcStage">${opt('','Auto · '+ST[o.status],S.stage[o.key]||'')}${Object.entries(ST).map(([k,v])=>opt(k,v,S.stage[o.key]||'')).join('')}</select></label>`:''}
 ${o&&c.k!=='mega'?`<label>My team <select id="pcTeam">${opt('','Not registered',S.reg[o.key]||'')}${Object.entries(TS).map(([k,v])=>opt(k,v,S.reg[o.key]||'')).join('')}</select></label>`:''}<span class="today">Prototype date · Thu 13 May 2027</span></div>`;
 $('#pcPage').onchange=e=>{if(e.target.value)location.href=e.target.value;};
 $('#pcAuth').onchange=e=>{S.auth=e.target.value==='1';renderAll();};
 const st=$('#pcStage');if(st)st.onchange=()=>{if(st.value)S.stage[o.key]=st.value;else delete S.stage[o.key];renderAll();};
 const ss=$('#pcSos');if(ss)ss.onchange=()=>{S.sosMode=ss.value;renderAll();toast(ss.value==='auto'?'Test mode: your SoS fits every level':'Real rules: SoS 4.5');};
 const te=$('#pcTeam');if(te)te.onchange=()=>{const v=te.value;if(!v){delete S.reg[o.key];}else{S.reg[o.key]=v;S.partner[o.key]=S.partner[o.key]||(o.cat==='mixed'?'BC-00932':'BC-00871');S.paid[o.key]=S.paid[o.key]||'Money Transfer';if(v==='canceled')S.why[o.key]=S.why[o.key]||'Payment not verified · the transfer screenshot did not show the full amount.';}renderAll();};}
function renderAll(){CUR=route();const c=CUR;
 if(c.k!=='home'){const tabs=TT[c.k==='mega'?'mega':'mini'];if(!tabs.some(t=>t[0]===S.pt&&!tabOff(c.o,t[0])))S.pt=tabs[0][0];}
 renderProto();clearInterval(HT);
 $('#app').innerHTML=(c.k==='home'?homeBand():tband(c))+'<nav class="menu gutter"><div class="in"><div class="bar" id="menu"></div></div></nav><main class="gutter"><div class="in" id="main"></div></main>';
 wire($('#app'));const si=$('#signin');if(si)si.onclick=authGate;
 renderMenu();renderMain();if(c.k==='home')slider();
 document.title=c.k==='home'?'Bassio Tournaments':`${c.k==='level'?c.m.n+' · '+c.o.n:c.o.n} · Bassio Tournaments`;}
function renderMenu(){const c=CUR,mb=$('#menu');
 if(c.k==='home'){mb.innerHTML=[['mini','Mini Tournaments','trophy'],['mega','Mega Tournaments','layers']].map(([k,l,i])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${I[i]}${l}</button>`).join('');
  mb.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.calDay=null;renderMenu();renderMain();});return;}
 mb.innerHTML=TT[c.k==='mega'?'mega':'mini'].map(([k,l,i])=>{const off=tabOff(c.o,k);return `<button data-t="${k}" class="${S.pt===k?'on':''}" ${off?`disabled title="${off}" aria-label="${l} · ${off}"`:''}>${I[i]}${l}${off?`<i class="lk">${I.lock}</i>`:''}</button>`;}).join('');
 mb.querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>{S.pt=b.dataset.t;S.sub='';S.q='';renderMenu();renderMain();});}
function renderMain(){const c=CUR,m=$('#main'),o=c.o;
 m.innerHTML=c.k==='home'?homeMain():c.k==='mega'?{info:pInfo,guide:pGuide,levels:pLevels}[S.pt](o):actions(o)+{overview:pOverview,teams:pTeams,groups:pGroups,ko:pKO,winners:pWinners}[S.pt](o);
 wire(m);const on=(sel,fn)=>m.querySelectorAll(sel).forEach(b=>b.addEventListener('click',e=>fn(b,e)));
 if(c.k==='home'){
  [['fSeason','season',v=>+v],['fMonth','month',v=>v==='all'?'all':+v],['fCat','cat',v=>v],['fLvl','lvl',v=>v]].forEach(([id,k,f])=>{const el=m.querySelector('#'+id);el.onchange=()=>{S[k]=f(el.value);S.calDay=null;renderMain();};});
  on('.vswitch button',b=>{S.view=b.dataset.v;if(S.view==='cal'&&S.month==='all')S.month=TODAY.getMonth()+1;renderMain();});
  on('[data-allm]',()=>{S.month='all';renderMain();});
  m.querySelectorAll('.arrows').forEach(ar=>{const tr=$('#'+ar.dataset.tr),[p,n]=ar.querySelectorAll('button'),upd=()=>{p.disabled=tr.scrollLeft<4;n.disabled=tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-4;};
   const go=d=>tr.scrollBy({left:d*(tr.firstElementChild.getBoundingClientRect().width+14),behavior:'smooth'});p.onclick=()=>go(-1);n.onclick=()=>go(1);
   tr.addEventListener('scroll',()=>{clearTimeout(tr._u);tr._u=setTimeout(upd,80);},{passive:true});upd();});
  const cm=d=>{S.month=(S.month==='all'?TODAY.getMonth()+1:S.month)+d;S.calDay=null;renderMain();};on('#calPrev',()=>cm(-1));on('#calNext',()=>cm(1));
  on('.day',(b,e)=>{if(e.target.closest('.ev')||!b.dataset.day)return;S.calDay=S.calDay===b.dataset.day?null:b.dataset.day;renderMain();});
  on('#calAll',()=>{S.calDay=null;renderMain();});return;}
 on('#aReg',b=>{if(b.dataset.go==='my'){S.pt='teams';S.sub='my';renderMenu();renderMain();}else openReg(o,b.dataset.go==='resub'?2:1);});
 on('#aLfp',()=>openLfp(o));
 on('[data-s]',b=>{S.sub=b.dataset.s;renderMain();});
 on('[data-tab]',b=>{S.pt=b.dataset.tab;S.sub='';renderMenu();renderMain();});
 on('[data-photo]',b=>photoModal(o,+b.dataset.photo));
 on('#mtCancel',()=>cancelModal(o));on('#mtResub',()=>openReg(o,2));
 const q=m.querySelector('#q');if(q)q.oninput=()=>{S.q=q.value;m.querySelector('#res').innerHTML=S.pt==='groups'?groupsRes(o):koRes(o);};}
function slider(){const tr=$('#htrack'),dots=[...document.querySelectorAll('#hdots button')],n=dots.length,cur=()=>Math.round(tr.scrollLeft/tr.clientWidth);
 const go=i=>tr.scrollTo({left:((i+n)%n)*tr.clientWidth,behavior:'smooth'}),sync=()=>dots.forEach((d,i)=>d.classList.toggle('on',i===cur()));
 const auto=()=>{clearInterval(HT);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)HT=setInterval(()=>{if(document.contains(tr))go(cur()+1);else clearInterval(HT);},6000);};
 const hold=()=>{clearInterval(HT);clearTimeout(tr._h);tr._h=setTimeout(auto,12000);};
 tr.addEventListener('scroll',()=>{clearTimeout(tr._s);tr._s=setTimeout(sync,60);},{passive:true});
 dots.forEach((d,i)=>d.onclick=()=>{go(i);hold();});$('#hPrev').onclick=()=>{go(cur()-1);hold();};$('#hNext').onclick=()=>{go(cur()+1);hold();};
 tr.onmouseenter=()=>clearInterval(HT);tr.onmouseleave=auto;tr.addEventListener('touchstart',hold,{passive:true});sync();auto();}
window.addEventListener('hashchange',()=>{S.pt='';S.sub='';S.q='';renderAll();window.scrollTo(0,0);});
renderAll();
</script>
</body>
</html>
